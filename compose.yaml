# Base services. Host port publishing happens in compose.dev.yaml / compose.test.yaml.
# On the shared VPS nothing here may conflict with neighbours (see ADR-0003).
services:
  postgres:
    image: postgres:15-alpine
    container_name: library-postgres
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    volumes:
      - library_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  library_pgdata:
