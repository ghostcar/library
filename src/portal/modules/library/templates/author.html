{% extends "base.html" %}{% block content %}
<h1 class="u-display u-weight-normal">Автор</h1>
{% if sources %}<div class="card"><p class="meta">ИСТОЧНИКИ</p>{% for source in sources %}<p class="u-my-4"><span class="chip">{{ source.role }}</span> <a href="{{ source.url }}" rel="noreferrer noopener">{{ source.name }}</a></p>{% endfor %}</div>{% endif %}
<div class="card"><p class="meta">ПРОИЗВЕДЕНИЯ АВТОРА</p>{% for w in works %}<p><a class="u-on-surface" href="/library/works/{{ w.work_id }}">{{ w.title }}</a></p>{% else %}<p class="meta">Произведений пока нет.</p>{% endfor %}</div>
{% endblock %}
