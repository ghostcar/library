# library.gorbunovr.ru — host nginx → 127.0.0.1:8001 (ADR-0003).
# Применяется пользователем вручную (нужен sudo):
#   sudo cp deploy/nginx/library.conf /etc/nginx/sites-available/library
#   sudo ln -s /etc/nginx/sites-available/library /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS: Cloudflare origin cert (тот же механизм, что у tracker).
# Требуется DNS-запись library.gorbunovr.ru → Cloudflare (proxy on).

server {
    listen 443 ssl;
    http2 on;
    server_name library.gorbunovr.ru;

    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # uploads: до 20 файлов по 50 МБ
    client_max_body_size 60m;

    # Static — кэш 30 дней immutable
    location /static/ {
        proxy_pass http://127.0.0.1:8001/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # OPDS для читалки — базовая авторизация внутри приложения
    location /opds/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Всё остальное
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

server {
    listen 80;
    server_name library.gorbunovr.ru;
    return 301 https://$host$request_uri;
}
