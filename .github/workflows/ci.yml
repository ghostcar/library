name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check src tests migrations
          ruff format --check src tests migrations

      - name: Type check
        run: mypy

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
          POSTGRES_DB: library_test
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U library -d library_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LIBRARY_TEST_DATABASE_URL: postgresql+asyncpg://library:library@127.0.0.1:55441/library_test
      LIBRARY_JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -m "not integration"

      - name: Integration tests
        run: pytest -m "integration"

      - name: Migration check (fresh database)
        run: alembic -x database_url="$LIBRARY_TEST_DATABASE_URL" upgrade head

  # Container build and GHCR push are added in Phase 9 (deploy),
  # after the Dockerfile exists; never automatic on this stage.
