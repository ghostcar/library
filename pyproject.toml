[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "library-portal"
version = "0.1.0"
description = "Personal library module of the macroportal (Ghostcar)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "email-validator>=2.2",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "httpx>=0.28",
    "lxml>=5.3",
    "Pillow>=11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "lxml-stubs>=0.5",
    "greenlet>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portal = [
    "py.typed",
    "web/templates/*.html",
    "web/static/css/*.css",
    "web/static/js/*.js",
    "modules/library/templates/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring PostgreSQL (deselected without LIBRARY_TEST_DATABASE_URL)",
]
addopts = "-m 'not integration' --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "B",           # bugbear
    "UP",          # pyupgrade
    "ASYNC",       # async correctness
    "S",           # bandit
    "RUF",
]
ignore = [
    "S101",  # assert in tests is fine; bandit S101 disabled globally, tests use asserts
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "RUF001", "RUF002", "RUF003"]
"migrations/**" = ["E501"]
"src/portal/modules/library/ai/omniroute.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["portal"]
strict = true
disallow_untyped_decorators = false
plugins = []

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
